name: Windows build and PPTX smoke test

on:
  push:
    branches: [main, feature/offline-pptx-viewer]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt (build machine only)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtpdf'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Smoke tests
        run: ctest --test-dir build --output-on-failure

  aspose-sdk-layout:
    if: github.head_ref == 'feature/aspose-slides-renderer'
    runs-on: windows-2022
    steps:
      - name: Inspect Aspose.Slides.Cpp 26.9.0 NuGet native SDK layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'aspose-probe'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          $url = 'https://api.nuget.org/v3-flatcontainer/aspose.slides.cpp/26.9.0/aspose.slides.cpp.26.9.0.nupkg'
          $zip = Join-Path $root 'slides.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dir = Join-Path $root 'slides'
          Expand-Archive -Path $zip -DestinationPath $dir
          Write-Host '=== Candidate includes/libraries/DLLs ==='
          Get-ChildItem -Path $dir -Recurse -File |
            Where-Object { $_.Name -match 'Presentation\.h$|Slides.*\.(lib|dll)$|Translator.*\.(lib|dll)$|\.targets$|\.props$|\.nuspec$' } |
            ForEach-Object { $_.FullName.Substring($dir.Length + 1) } |
            Select-Object -First 120
          Write-Host '=== Top level folders ==='
          Get-ChildItem -Path $dir -Directory | ForEach-Object { $_.Name }
          Write-Host '=== NuGet manifest ==='
          Get-Content (Join-Path $dir 'Aspose.Slides.Cpp.nuspec') | Select-Object -First 100
          Write-Host '=== Native targets ==='
          Get-Content (Join-Path $dir 'build/native/Aspose.Slides.Cpp.targets') | Select-Object -First 130
          Write-Host '=== Library folder ==='
          Get-ChildItem (Join-Path $dir 'build/native/lib') -File |
            Select-Object -First 50 -ExpandProperty Name


  aspose-native-compile:
    if: github.head_ref == 'feature/aspose-slides-renderer'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt (build machine only)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtpdf'
          cache: true
      - name: Download official evaluation SDKs and configure native linkage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'aspose-test'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          foreach ($package in @('aspose.slides.cpp', 'codeporting.translator.cs2cpp.framework')) {
            $url = "https://api.nuget.org/v3-flatcontainer/$package/26.9.0/$package.26.9.0.nupkg"
            $zip = Join-Path $root "$package.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath (Join-Path $root $package)
          }
          $slides = Join-Path $root 'aspose.slides.cpp'
          $framework = Join-Path $root 'codeporting.translator.cs2cpp.framework'
          Write-Host 'Framework native package files:'
          Get-ChildItem $framework -Recurse -File |
            Where-Object { $_.Name -match 'string\.h$|\.lib$|\.dll$' } |
            ForEach-Object { $_.FullName.Substring($framework.Length + 1) } |
            Select-Object -First 50

          $frameworkHeader = Get-ChildItem $framework -Recurse -File -Filter string.h |
            Where-Object { $_.FullName -match '[\\/]system[\\/]string\.h$' } |
            Select-Object -First 1
          if (-not $frameworkHeader) { throw 'CodePorting system/string.h not found' }
          $frameworkInclude = Split-Path (Split-Path $frameworkHeader.FullName -Parent) -Parent

          $frameworkLibs = @(Get-ChildItem $framework -Recurse -File -Filter '*.lib' |
            Where-Object { $_.Name -match 'x64\.lib$' } |
            Select-Object -ExpandProperty FullName)
          $frameworkDlls = @(Get-ChildItem $framework -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Name -match 'x64\.dll$' } |
            Select-Object -ExpandProperty FullName)
          if ($frameworkLibs.Count -lt 1) { throw 'CodePorting x64 library missing' }

          $include = Join-Path $slides 'build/native/include/aspose.slides.cpp'
          $lib = Join-Path $slides 'build/native/lib/Aspose.Slides_vc14x64.lib'
          $dll = Join-Path $slides 'build/native/lib/Aspose.Slides_vc14x64.dll'
          $allDlls = @($dll) + $frameworkDlls
          $options = @(
              '-S', '.', '-B', 'build-aspose', '-G', 'Ninja',
              '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_TESTING=OFF',
              '-DSIFT_USE_ASPOSE=ON', "-DASPOSE_SLIDES_INCLUDE_DIR=$include",
              "-DASPOSE_SLIDES_LIBRARY=$lib",
              "-DASPOSE_SLIDES_EXTRA_INCLUDE_DIRS=$frameworkInclude",
              "-DASPOSE_SLIDES_EXTRA_LIBS=$($frameworkLibs -join ';')",
              "-DASPOSE_RUNTIME_DLLS=$($allDlls -join ';')"
          )
          & cmake @options
          if ($LASTEXITCODE -ne 0) { throw 'Aspose CMake configure failed' }
      - name: Compile SDK-enabled Sift
        run: cmake --build build-aspose --parallel 2
