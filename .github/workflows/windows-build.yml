name: Windows build and PPTX smoke test

on:
  push:
    branches: [main, feature/offline-pptx-viewer]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt (build machine only)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtpdf'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Smoke tests
        run: ctest --test-dir build --output-on-failure

  aspose-native-compile:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt (build machine only)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtpdf'
          cache: true
      - name: Build SDK-enabled Sift using its official setup script
        shell: pwsh
        run: ./scripts/setup-aspose.ps1 -AcceptAsposeLicense -QtPrefix "$env:QT_ROOT_DIR"
      - name: Install CI-only PowerPoint fixture generator
        run: python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Verify PPT and PPTX loading and rendering
        run: ctest --test-dir build-aspose --output-on-failure
